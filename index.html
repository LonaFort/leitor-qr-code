<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
      :root { --primary: #333; --bg: #f4f6f8; --text: #333; --border: 12px; }
      body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); padding: 15px; margin: 0; display: flex; justify-content: center; }
      .card { background: white; padding: 20px; border-radius: var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; box-sizing: border-box; }
      
      h3 { text-align: center; margin-top: 0; color: var(--text); }
      #reader { width: 100%; border-radius: 8px; margin-bottom: 15px; border: 2px solid #ddd; }
      
      .btn-camera { padding: 15px; background: #0E6D64; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 18px; margin-bottom: 15px;}
      .btn-trocar { padding: 10px; background: #607d8b; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 15px;}
      
      .badge-tipo { text-align: center; font-weight: bold; padding: 8px; border-radius: 5px; color: white; margin-bottom: 15px; font-size: 18px; text-transform: uppercase;}
      .badge-fracionado { background-color: #0E6D64; }
      .badge-bobina { background-color: #1976d2; }

      label { font-weight: 500; font-size: 14px; display: block; margin: 12px 0 5px; color: var(--text); }
      input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
      textarea { resize: vertical; min-height: 70px; }
      .row { display: flex; gap: 10px; } .col { flex: 1; }
      
      .box-verde { background: #e8f5e9; border: 1px solid #a5d6a7; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
      .txt-sucesso { color: #2e7d32; font-weight: bold; font-size: 18px; margin: 0; }
      
      .caixa-troca { background: #fff8e1; border: 1px solid #ffe082; padding: 15px; border-radius: 8px; margin-top: 15px; }
      .radio-group { display: flex; gap: 20px; margin-top: 5px; }
      .btn-enviar { padding: 15px; font-size: 18px; background: var(--primary); color: white; border: none; border-radius: 30px; width: 100%; cursor: pointer; margin-top: 25px; font-weight: bold; }
      .btn-enviar:disabled { background: #999; }
      #mensagem { text-align: center; font-weight: bold; margin-top: 15px; font-size: 16px; }
      
      /* Mantém os formulários escondidos no início */
      .secao { display: none; } 
      .secao.active { display: block; }
    </style>
  </head>
  <body>
    <div class="card">
      
      <!-- TELA INICIAL: APENAS A CÂMERA -->
      <div id="tela-inicial" class="secao active">
        <h3 style="color:#0E6D64; margin-bottom:20px;">Lona Fort Expedição</h3>
        <button class="btn-camera" id="btn-camera" onclick="iniciarCamera()">📷 Ler Etiqueta (Escanear)</button>
        <div id="reader" style="display: none;"></div>
      </div>

      <!-- FORMULÁRIO FRACIONADOS (Aparece só se for Fracionado) -->
      <div id="form-fracionado" class="secao">
        <div class="badge-tipo badge-fracionado">Estoque Fracionado</div>
        <button class="btn-trocar" onclick="voltarParaCamera()">🔄 Ler Outro Produto</button>
        
        <label>Produto Bipado:</label>
        <input type="text" id="f_produto">
        
        <div class="row">
          <div class="col"><label>Qtd:</label><input type="number" id="f_qtd" value="1"></div>
          <div class="col">
            <label>Modalidade:</label>
            <select id="f_modalidade">
              <option value="" disabled selected>Selecione...</option>
              <option value="SHOPEE">SHOPEE</option>
              <option value="MERCADO LIVRE">MERCADO LIVRE</option>
              <option value="BALCÃO">BALCÃO</option>
            </select>
          </div>
        </div>
        
        <div class="row">
          <div class="col"><label>L.Ped:</label><input type="text" id="f_lped"></div>
          <div class="col"><label>Ped:</label><input type="text" id="f_ped"></div>
        </div>
        <label>NF (Opcional):</label><input type="text" id="f_nf">
        <label>Responsável:</label><input type="text" id="f_resp" placeholder="Ex: Marcos">
        
        <div class="caixa-troca">
          <label style="color:#f57f17; margin-top:0;">Houve Troca?</label>
          <div class="radio-group">
            <label><input type="radio" name="f_isTroca" value="sim" onchange="document.getElementById('f_divTroca').style.display='block'"> Sim</label>
            <label><input type="radio" name="f_isTroca" value="nao" onchange="document.getElementById('f_divTroca').style.display='none'" checked> Não</label>
          </div>
          <div id="f_divTroca" style="display:none; margin-top:10px;">
            <label>Pedido Inicial:</label><input type="text" id="f_pedInicial">
            <label>Tipo Metragem:</label>
            <select id="f_tipoMet"><option value="LINEAR">LINEAR</option><option value="M²">M²</option></select>
          </div>
        </div>
        <label>Obs:</label><textarea id="f_obs"></textarea>
      </div>

      <!-- FORMULÁRIO BOBINAS (Aparece só se for Bobina) -->
      <div id="form-bobina" class="secao">
        <div class="badge-tipo badge-bobina">Bobina Fechada</div>
        <button class="btn-trocar" onclick="voltarParaCamera()">🔄 Ler Outro Produto</button>

        <div class="box-verde" id="b_boxVerde" style="display:none;">
          <p class="txt-sucesso" id="b_nomeProduto">Nome do Produto</p>
        </div>
        
        <label>Código Bobina:</label>
        <input type="text" id="b_codigo" onchange="buscarNomeBobina(this.value)">
        
        <div class="row">
          <div class="col"><label>Tamanho:</label><input type="text" id="b_tamanho" placeholder="Ex: 12x22"></div>
          <div class="col"><label>Qtd:</label><input type="number" id="b_qtd" value="1"></div>
        </div>
        
        <label>Modalidade:</label>
        <select id="b_modalidade">
          <option value="" disabled selected>Selecione...</option>
          <option value="LONAFORT">LONAFORT</option>
          <option value="GEOMEMBRANA">GEOMEMBRANA</option>
          <option value="SHOPEE">SHOPEE</option>
          <option value="FRACIONADO">FRACIONADO</option>
        </select>
        
        <div class="row">
          <div class="col"><label>Pedido:</label><input type="text" id="b_ped"></div>
          <div class="col"><label>NF:</label><input type="text" id="b_nf"></div>
        </div>
        <label>O.C.:</label><input type="text" id="b_oc">
        
        <div class="caixa-troca">
          <label style="color:#f57f17; margin-top:0;">Houve Substituição?</label>
          <div class="radio-group">
            <label><input type="radio" name="b_isTroca" value="sim" onchange="document.getElementById('b_divTroca').style.display='block'"> Sim</label>
            <label><input type="radio" name="b_isTroca" value="nao" onchange="document.getElementById('b_divTroca').style.display='none'" checked> Não</label>
          </div>
          <div id="b_divTroca" style="display:none; margin-top:10px;">
            <label>Código Substituto:</label><input type="text" id="b_codTroca">
            <label>Tipo Metragem:</label>
            <select id="b_tipoMet"><option value="M²">M²</option><option value="LINEAR">LINEAR</option></select>
          </div>
        </div>
        <label>Obs:</label><textarea id="b_obs"></textarea>
      </div>

      <!-- BOTÃO DE ENVIO (Inicia escondido) -->
      <button class="btn-enviar" id="btn-enviar" style="display:none;" onclick="enviarDados()">🚀 Confirmar Baixa</button>
      <p id="mensagem"></p>
    </div>

    <script>
      // ==========================================================
      const API_URL = "https://script.google.com/macros/s/AKfycbz3-20YlZuS_oeIqG5hCxQIwP4muBDvpLO0QzRMMUloClCbur2HzvBPGSh2D5d7qqmjqA/exec";
      // ==========================================================

      let modoAtual = '';
      let html5QrCode;

      function bip() { if(navigator.vibrate) navigator.vibrate(100); }

      function voltarParaCamera() {
        document.getElementById('form-fracionado').classList.remove('active');
        document.getElementById('form-bobina').classList.remove('active');
        document.getElementById('btn-enviar').style.display = 'none';
        document.getElementById('mensagem').innerText = '';
        
        document.getElementById('tela-inicial').classList.add('active');
      }

      function iniciarCamera() {
        document.getElementById('btn-camera').style.display = 'none';
        document.getElementById('reader').style.display = 'block';
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: { width: 250, height: 250 } }, onScanSuccess, (err)=>{})
        .catch(err => { alert("Erro ao acessar a câmera."); document.getElementById('btn-camera').style.display = 'block'; });
      }

      function onScanSuccess(texto) {
        bip();
        html5QrCode.stop();
        document.getElementById('reader').style.display = 'none';
        document.getElementById('btn-camera').style.display = 'block';
        
        document.getElementById('tela-inicial').classList.remove('active');
        document.getElementById('btn-enviar').style.display = 'block';

        let lidoMaiusculo = texto.trim().toUpperCase();
        
        // REGRA DE OURO: Se o texto lido começar com "ECO" ou "LON", é Bobina Fechada. Caso contrário, Fracionado.
        if (lidoMaiusculo.startsWith("ECO") || lidoMaiusculo.startsWith("LON")) {
          modoAtual = 'bobina';
          document.getElementById('form-bobina').classList.add('active');
          document.getElementById('btn-enviar').style.backgroundColor = '#1976d2';
          
          document.getElementById('b_codigo').value = texto;
          buscarNomeBobina(texto);
        } else {
          modoAtual = 'fracionado';
          document.getElementById('form-fracionado').classList.add('active');
          document.getElementById('btn-enviar').style.backgroundColor = '#0E6D64';
          
          document.getElementById('f_produto').value = texto;
        }
      }

      function buscarNomeBobina(codigo) {
        if(!codigo) return;
        let box = document.getElementById('b_boxVerde');
        let txt = document.getElementById('b_nomeProduto');
        box.style.display = 'block'; box.style.borderColor = '#ccc'; box.style.backgroundColor = '#eee';
        txt.innerText = 'Buscando material...'; txt.style.color = '#555';
        
        fetch(API_URL + "?codigo=" + encodeURIComponent(codigo))
          .then(res => res.json())
          .then(data => {
            let nome = data.nome;
            txt.innerText = nome;
            if(nome !== "Produto não encontrado" && nome !== "Erro ao buscar material") { 
              box.style.borderColor = '#a5d6a7'; box.style.backgroundColor = '#e8f5e9'; txt.style.color = '#2e7d32'; 
            }
            else { 
              box.style.borderColor = '#ef9a9a'; box.style.backgroundColor = '#ffebee'; txt.style.color = '#c62828'; 
            }
          }).catch(err => {
            txt.innerText = "Erro ao buscar material";
            box.style.borderColor = '#ef9a9a'; box.style.backgroundColor = '#ffebee'; txt.style.color = '#c62828';
          });
      }

      function enviarDados() {
        let btn = document.getElementById('btn-enviar');
        let msg = document.getElementById('mensagem');
        let payload = { tipo: modoAtual };

        if (modoAtual === 'fracionado') {
          payload.produto = document.getElementById('f_produto').value.trim();
          payload.quantidade = document.getElementById('f_qtd').value;
          payload.modalidade = document.getElementById('f_modalidade').value;
          payload.lped = document.getElementById('f_lped').value;
          payload.ped = document.getElementById('f_ped').value;
          payload.nf = document.getElementById('f_nf').value;
          payload.responsavel = document.getElementById('f_resp').value;
          payload.isTroca = document.querySelector('input[name="f_isTroca"]:checked').value;
          payload.pedidoInicial = document.getElementById('f_pedInicial').value;
          payload.tipoMetragem = document.getElementById('f_tipoMet').value;
          payload.observacao = document.getElementById('f_obs').value;
          if(!payload.produto || !payload.modalidade) { alert("Preencha o Produto e a Modalidade!"); return; }
        } else {
          payload.codigo = document.getElementById('b_codigo').value.trim();
          payload.tamanho = document.getElementById('b_tamanho').value.trim();
          payload.quantidade = document.getElementById('b_qtd').value;
          payload.modalidade = document.getElementById('b_modalidade').value;
          payload.ped = document.getElementById('b_ped').value;
          payload.nf = document.getElementById('b_nf').value;
          payload.oc = document.getElementById('b_oc').value;
          payload.isTroca = document.querySelector('input[name="b_isTroca"]:checked').value;
          payload.codigoTroca = document.getElementById('b_codTroca').value;
          payload.tipoMetragem = document.getElementById('b_tipoMet').value;
          payload.observacao = document.getElementById('b_obs').value;
          if(!payload.codigo || !payload.tamanho || !payload.modalidade) { alert("Preencha Código, Tamanho e Modalidade!"); return; }
        }

        btn.disabled = true; btn.innerText = "Enviando..."; msg.innerText = "";
        
        fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(res => {
          if(res.sucesso) {
            bip(); msg.innerText = "BAIXA REGISTRADA COM SUCESSO!"; msg.style.color = "green";
            setTimeout(() => { location.reload(); }, 2000);
          } else {
            msg.innerText = "Erro: " + res.erro; msg.style.color = "red"; btn.disabled = false; btn.innerText = "Tentar Novamente";
          }
        }).catch(err => { msg.innerText = "Erro de conexão ao salvar."; msg.style.color = "red"; btn.disabled = false; btn.innerText = "Tentar Novamente"; });
      }
    </script>
  </body>
</html>
