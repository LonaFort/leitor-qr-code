<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
      :root {
        --primary-color: #d32f2f;
        --secondary-color: #f5f5f5;
        --text-color: #333;
        --border-radius: 12px;
      }
      body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        background-color: #e9ecef; margin: 0; display: flex;
        justify-content: center; align-items: center; min-height: 100vh;
        padding: 20px; box-sizing: border-box;
      }
      .card {
        background-color: white; padding: 25px; border-radius: var(--border-radius);
        box-shadow: 0 8px 24px rgba(0,0,0,0.15); width: 100%; max-width: 400px;
        box-sizing: border-box;
      }
      h2 { color: var(--text-color); text-align: center; margin-top: 0; margin-bottom: 20px; font-weight: 600;}
      #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 20px; border: 2px solid #ddd; }
      #btn-iniciar-camera {
        padding: 12px; background-color: #1976d2; color: white; border: none;
        border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 15px; font-weight: bold; font-size: 16px;
      }
      .produto-container { background-color: var(--secondary-color); padding: 15px; border-radius: var(--border-radius); text-align: center; margin-bottom: 20px; border: 1px solid #ddd; }
      .produto-label { font-size: 12px; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
      .produto-destaque { color: var(--primary-color); font-size: 20px; font-weight: bold; margin: 0; }
      .produto-sucesso { color: #2e7d32; font-size: 26px; font-weight: bold; margin: 0; }
      label { font-weight: 500; font-size: 14px; color: var(--text-color); display: block; margin-top: 15px; margin-bottom: 8px; }
      input[type="text"], input[type="number"], select, textarea {
        width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px;
        box-sizing: border-box; font-size: 16px; background-color: #fafafa;
      }
      textarea { resize: vertical; min-height: 80px; }
      .row { display: flex; gap: 10px; } 
      .col { flex: 1; }
      .caixa-troca { background-color: #fff8e1; border: 1px solid #ffe082; padding: 20px; border-radius: var(--border-radius); margin-top: 25px; }
      .radio-group { display: flex; gap: 30px; margin-top: 10px; }
      .radio-group label { margin-top: 0; font-weight: 500; display: flex; align-items: center; cursor: pointer;}
      .radio-group input[type="radio"] { margin-right: 8px; transform: scale(1.2); }
      button.btn-principal { 
        padding: 16px; font-size: 18px; background-color: var(--primary-color); color: white; 
        border: none; border-radius: 30px; width: 100%; cursor: pointer; margin-top: 30px; font-weight: bold; text-transform: uppercase;
      }
      button.btn-principal:disabled { background-color: #9e9e9e; cursor: not-allowed;}
      #mensagem { text-align: center; font-weight: bold; margin-top: 20px; color: #2e7d32; font-size: 16px;}
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Registrar Saída</h2>
      
      <button id="btn-iniciar-camera" onclick="iniciarCamera()">Ligar Câmera</button>
      <div id="reader" style="display: none;"></div>
      
      <div class="produto-container">
        <div class="produto-label">Produto Detectado</div>
        <div class="produto-destaque" id="textoTamanho">Nenhum produto lido</div>
      </div>
      
      <label>Quantidade:</label>
      <input type="number" id="quantidade" value="1" min="1">
      
      <div class="row">
        <div class="col">
          <label>L.Ped. (Opcional):</label>
          <input type="text" id="lped" placeholder="Ex: 1">
        </div>
        <div class="col">
          <label>Ped. (Opcional):</label>
          <input type="text" id="ped" placeholder="Ex: 12345">
        </div>
      </div>

      <label>Modalidade:</label>
      <select id="modalidade">
        <option value="" disabled selected>Selecione...</option>
        <option value="MERCADO LIVRE">MERCADO LIVRE</option>
        <option value="FLEX">FLEX</option>
        <option value="SOLOPROTEC">SOLOPROTEC</option>
        <option value="APD2">APD2</option>
        <option value="LONAFORT">LONAFORT</option>
        <option value="GEOMEMBRANA">GEOMEMBRANA</option>
        <option value="SHOPEE">SHOPEE</option>
        <option value="CORREIOS">CORREIOS</option>
        <option value="FULL">FULL</option>
        <option value="MAGALU">MAGALU</option>
        <option value="RETIRA">RETIRA</option>
        <option value="AJUSTE">AJUSTE</option>
        <option value="REFUGO">REFUGO</option>
        <option value="OUTRO">OUTRO</option>
        <option value="GEOEXC">GEOEXC</option>
      </select>
      
      <label>NF (Opcional):</label>
      <input type="text" id="nf" placeholder="Número da Nota">

      <label>Responsável:</label>
      <input type="text" id="responsavel" placeholder="Nome da pessoa">
      
      <div class="caixa-troca">
        <label style="margin-top: 0; color: #f57f17; font-size: 16px;">Troca de material?</label>
        <div class="radio-group">
          <label><input type="radio" name="isTroca" value="sim" onchange="mostrarCamposTroca(true)"> Sim</label>
          <label><input type="radio" name="isTroca" value="nao" onchange="mostrarCamposTroca(false)" checked> Não</label>
        </div>
        
        <div id="camposExtrasTroca" style="display: none; margin-top: 20px;">
          <label>Pedido Inicial:</label>
          <input type="text" id="pedidoInicial" placeholder="Ex: PB 10X50">
          
          <label>Tipo de Metragem:</label>
          <select id="tipoMetragem">
            <option value="m²">m²</option>
            <option value="m. linear">m. linear</option>
          </select>
        </div>
      </div>

      <label>Observação (Opcional):</label>
      <textarea id="observacao" placeholder="Adicione detalhes..."></textarea>

      <button class="btn-principal" id="btnConfirmar" onclick="confirmar()" disabled>Aguardando Leitura</button>
      <p id="mensagem"></p>
    </div>

    <script>
      // ==========================================================
      // COLE AQUI O URL DO SEU GOOGLE APPS SCRIPT!
      // ==========================================================
      const API_URL = "https://script.google.com/a/macros/lonafort.com.br/s/AKfycbz3-20YlZuS_oeIqG5hCxQIwP4muBDvpLO0QzRMMUloClCbur2HzvBPGSh2D5d7qqmjqA/exec";
      let html5QrCode;

      function tocarSom(tipo) {
        try {
          var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          var oscillator = audioCtx.createOscillator();
          var gainNode = audioCtx.createGain();
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          if (tipo === 'bip') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.1);
          } else if (tipo === 'sucesso') {
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
            oscillator.frequency.setValueAtTime(900, audioCtx.currentTime + 0.15);
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.4);
          }
        } catch (e) { }
      }

      function iniciarCamera() {
        var btnCamera = document.getElementById('btn-iniciar-camera');
        btnCamera.innerText = "Solicitando permissão...";
        Html5Qrcode.getCameras().then(devices => {
          if (devices && devices.length) {
            btnCamera.style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: { width: 250, height: 250 } }, onScanSuccess, onScanFailure)
            .catch(() => {
               html5QrCode.start(devices[devices.length - 1].id, { fps: 15, qrbox: { width: 250, height: 250 } }, onScanSuccess, onScanFailure);
            });
          } else { alert("Câmera não encontrada."); btnCamera.innerText = "Ligar Câmera"; }
        }).catch(err => { alert("Permissão negada!"); btnCamera.innerText = "Ligar Câmera"; });
      }

      function onScanSuccess(decodedText) {
        tocarSom('bip');
        var textoElem = document.getElementById('textoTamanho');
        textoElem.innerText = decodedText;
        textoElem.classList.remove("produto-destaque");
        textoElem.classList.add("produto-sucesso");
        
        var btn = document.getElementById('btnConfirmar');
        btn.disabled = false; btn.innerText = "Confirmar Baixa";
        if (navigator.vibrate) { navigator.vibrate([100]); }
        
        html5QrCode.stop().then(() => {
          document.getElementById('reader').style.display = 'none';
          var btnCamera = document.getElementById('btn-iniciar-camera');
          btnCamera.style.display = 'block'; btnCamera.innerText = "Ler Outro Produto";
        });
      }

      function onScanFailure(error) { }

      function mostrarCamposTroca(mostrar) {
        document.getElementById('camposExtrasTroca').style.display = mostrar ? 'block' : 'none';
      }

      function confirmar() {
        var btn = document.getElementById('btnConfirmar');
        var msg = document.getElementById('mensagem');
        var produtoLido = document.getElementById('textoTamanho').innerText;
        
        if (produtoLido === "Nenhum produto lido") { alert("Leia um código QR primeiro."); return; }

        var isTrocaSelecionado = document.querySelector('input[name="isTroca"]:checked').value;

        var dados = {
          tamanho: produtoLido,
          quantidade: document.getElementById('quantidade').value || "",
          lped: document.getElementById('lped').value || "",
          ped: document.getElementById('ped').value || "",
          modalidade: document.getElementById('modalidade').value || "",
          nf: document.getElementById('nf').value || "",
          isTroca: isTrocaSelecionado,
          pedidoInicial: isTrocaSelecionado === "sim" ? (document.getElementById('pedidoInicial').value || "") : "",
          tipoMetragem: isTrocaSelecionado === "sim" ? (document.getElementById('tipoMetragem').value || "") : "",
          responsavel: document.getElementById('responsavel').value || "",
          observacao: document.getElementById('observacao').value || ""
        };
        
        if(!dados.quantidade || !dados.modalidade || !dados.responsavel) {
          alert("Quantidade, modalidade e responsável são obrigatórios."); return;
        }

        btn.disabled = true; btn.innerText = "Salvando..."; msg.innerText = "";
        
        // A MÁGICA ACONTECE AQUI: O novo comando FETCH envia para o Google Apps Script
        fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(dados)
        })
        .then(response => response.json())
        .then(respostaJSON => {
          if (respostaJSON.sucesso) {
            tocarSom('sucesso');
            if (navigator.vibrate) { navigator.vibrate([100, 50, 100]); }
            msg.innerText = respostaJSON.mensagem; 
            btn.innerText = "BAIXA FINALIZADA!"; 
            btn.style.backgroundColor = "#2e7d32";
            
            setTimeout(function() {
              document.getElementById('textoTamanho').innerText = "Nenhum produto lido";
              document.getElementById('textoTamanho').className = "produto-destaque";
              document.getElementById('quantidade').value = 1;
              document.getElementById('lped').value = "";
              document.getElementById('ped').value = "";
              document.getElementById('nf').value = "";
              document.getElementById('responsavel').value = "";
              document.getElementById('observacao').value = "";
              document.getElementById('modalidade').selectedIndex = 0; 
              
              btn.disabled = true; btn.innerText = "Aguardando Leitura"; btn.style.backgroundColor = "var(--primary-color)"; msg.innerText = "";
              document.querySelector('input[name="isTroca"][value="nao"]').checked = true;
              mostrarCamposTroca(false); 
              document.getElementById('pedidoInicial').value = "";
            }, 3500); 
          } else {
             msg.innerText = "Erro: " + respostaJSON.erro; msg.style.color = "var(--primary-color)";
             btn.disabled = false; btn.innerText = "Tentar Novamente";
          }
        })
        .catch(erro => {
          console.error("Erro no fetch:", erro);
          msg.innerText = "Erro de conexão ao salvar. Tente de novo."; msg.style.color = "var(--primary-color)";
          btn.disabled = false; btn.innerText = "Tentar Novamente";
        });
      }
    </script>
  </body>
</html>
