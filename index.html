<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
      :root { --primary: #0E6D64; --bg: #f4f6f8; --text: #333; --border: 12px; }
      body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); padding: 15px; margin: 0; display: flex; justify-content: center; }
      .card { background: white; padding: 20px; border-radius: var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; box-sizing: border-box; }
      
      h3 { text-align: center; margin-top: 0; color: var(--primary); font-size: 22px; margin-bottom: 20px;}
      #reader { width: 100%; border-radius: 8px; margin-bottom: 15px; border: 2px solid #ddd; }
      
      .btn-camera { padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 18px; margin-bottom: 15px;}
      .btn-trocar { padding: 10px; background: #607d8b; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 15px;}
      
      .box-verde { background: #e8f5e9; border: 2px solid #a5d6a7; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px; }
      .txt-sucesso { color: #2e7d32; font-weight: bold; font-size: 22px; margin: 0; word-break: break-word; }
      .txt-label { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; font-weight: 600; }

      label { font-weight: 500; font-size: 14px; display: block; margin: 12px 0 5px; color: var(--text); }
      input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
      textarea { resize: vertical; min-height: 70px; }
      .row { display: flex; gap: 10px; } .col { flex: 1; }
      
      .caixa-troca { background: #fff8e1; border: 1px solid #ffe082; padding: 15px; border-radius: 8px; margin-top: 15px; }
      .radio-group { display: flex; gap: 20px; margin-top: 5px; }
      
      .btn-enviar { padding: 15px; font-size: 18px; background: var(--primary); color: white; border: none; border-radius: 30px; width: 100%; cursor: pointer; margin-top: 25px; font-weight: bold; }
      .btn-enviar:disabled { background: #999; }
      #mensagem { text-align: center; font-weight: bold; margin-top: 15px; font-size: 16px; }
      
      .secao { display: none; } 
      .secao.active { display: block; }
    </style>
  </head>
  <body>
    <div class="card">
      
      <!-- TELA 1: CÂMERA -->
      <div id="tela-inicial" class="secao active">
        <h3>📦 Expedição Fracionados</h3>
        <button class="btn-camera" id="btn-camera" onclick="iniciarCamera()">📷 Ler Etiqueta</button>
        <div id="reader" style="display: none;"></div>
      </div>

      <!-- TELA 2: FORMULÁRIO -->
      <div id="tela-form" class="secao">
        <button class="btn-trocar" onclick="voltarParaCamera()">🔄 Ler Outro Produto</button>

        <div class="box-verde">
          <div class="txt-label">Produto Identificado</div>
          <p class="txt-sucesso" id="nomeDisplay">-</p>
        </div>
        
        <input type="hidden" id="produto">
        
        <div class="row">
          <div class="col"><label>Qtd:</label><input type="number" id="qtd" value="1"></div>
          <div class="col">
            <label>Modalidade:</label>
            <select id="modalidade">
              <option value="" disabled selected>Selecione...</option>
              <option value="Mercado Livre">Mercado Livre</option>
              <option value="FLEX">FLEX</option>
              <option value="SOLOPROTEC">SOLOPROTEC</option>
              <option value="APD2">APD2</option>
              <option value="LONAFORT">LONAFORT</option>
              <option value="GEOMEMBRANA">GEOMEMBRANA</option>
              <option value="Shopee">Shopee</option>
              <option value="GEOEXC">GEOEXC</option>
              <option value="Correios">Correios</option>
              <option value="Magalu">Magalu</option>
              <option value="FRACIONADO">FRACIONADO</option>
              <option value="Retira">Retira</option>
              <option value="FULL">FULL</option>
              <option value="REFUGO">REFUGO</option>
              <option value="Outro">Outro</option>
              <option value="AJUSTE">AJUSTE</option>
              <option value="FLEX SOLOPROTEC">FLEX SOLOPROTEC</option>
            </select>
          </div>
        </div>
        
        <div class="row">
          <div class="col"><label>L.Ped:</label><input type="text" id="lped"></div>
          <div class="col"><label>Ped:</label><input type="text" id="ped"></div>
        </div>
        <label>NF (Opcional):</label><input type="text" id="nf">
        <label>Responsável:</label><input type="text" id="resp" placeholder="Ex: Marcos">
        
        <div class="caixa-troca">
          <label style="color:#f57f17; margin-top:0;">Houve Troca?</label>
          <div class="radio-group">
            <label><input type="radio" name="isTroca" value="sim" onchange="document.getElementById('divTroca').style.display='block'"> Sim</label>
            <label><input type="radio" name="isTroca" value="nao" onchange="document.getElementById('divTroca').style.display='none'" checked> Não</label>
          </div>
          <div id="divTroca" style="display:none; margin-top:10px;">
            <label>Pedido Inicial:</label><input type="text" id="pedInicial">
            <label>Tipo Metragem:</label>
            <select id="tipoMet"><option value="LINEAR">LINEAR</option><option value="M²">M²</option></select>
          </div>
        </div>
        <label>Obs:</label><textarea id="obs"></textarea>

        <button class="btn-enviar" id="btn-enviar" onclick="enviarDados()">🚀 Confirmar Baixa</button>
        <p id="mensagem"></p>
      </div>

    </div>

    <script>
      // =======================================================
      // COLE A SUA NOVA URL GERADA AQUI DENTRO DAS ASPAS:
      const API_URL = "COLE_AQUI_O_SEU_LINK_NOVO";
      // =======================================================

      let html5QrCode;

      function tocarSomBip() {
        try {
          var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          var oscillator = audioCtx.createOscillator();
          var gainNode = audioCtx.createGain();
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime); 
          gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
          oscillator.start(audioCtx.currentTime);
          oscillator.stop(audioCtx.currentTime + 0.15);
        } catch (e) { }
        if(navigator.vibrate) navigator.vibrate(100);
      }

      function voltarParaCamera() {
        document.getElementById('tela-form').classList.remove('active');
        document.getElementById('mensagem').innerText = '';
        document.getElementById('tela-inicial').classList.add('active');
      }

      function iniciarCamera() {
        document.getElementById('btn-camera').style.display = 'none';
        document.getElementById('reader').style.display = 'block';
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: { width: 250, height: 250 } }, onScanSuccess, (err)=>{})
        .catch(err => { alert("Erro ao acessar a câmera."); document.getElementById('btn-camera').style.display = 'block'; });
      }

      function onScanSuccess(texto) {
        tocarSomBip(); 
        html5QrCode.stop();
        document.getElementById('reader').style.display = 'none';
        document.getElementById('btn-camera').style.display = 'block';
        
        document.getElementById('tela-inicial').classList.remove('active');
        document.getElementById('tela-form').classList.add('active');
        
        let lidoTratado = texto.trim().toUpperCase();
        document.getElementById('produto').value = lidoTratado;
        document.getElementById('nomeDisplay').innerText = lidoTratado; 
      }

      function enviarDados() {
        let btn = document.getElementById('btn-enviar');
        let msg = document.getElementById('mensagem');
        
        let payload = {
          produto: document.getElementById('produto').value.trim(),
          quantidade: document.getElementById('qtd').value,
          modalidade: document.getElementById('modalidade').value,
          lped: document.getElementById('lped').value.trim(),
          ped: document.getElementById('ped').value.trim(),
          nf: document.getElementById('nf').value.trim(),
          responsavel: document.getElementById('resp').value.trim(),
          isTroca: document.querySelector('input[name="isTroca"]:checked').value,
          pedidoInicial: document.getElementById('pedInicial').value.trim(),
          tipoMetragem: document.getElementById('tipoMet').value,
          observacao: document.getElementById('obs').value.trim()
        };

        if(!payload.produto || !payload.modalidade) { alert("Preencha a Modalidade!"); return; }

        btn.disabled = true; btn.innerText = "Enviando..."; msg.innerText = "";
        
        fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(res => {
          if(res.sucesso) {
            tocarSomBip(); 
            msg.innerText = "BAIXA REGISTRADA COM SUCESSO!"; msg.style.color = "green";
            setTimeout(() => { location.reload(); }, 2000);
          } else {
            msg.innerText = "Erro: " + res.erro; msg.style.color = "red"; btn.disabled = false; btn.innerText = "Tentar Novamente";
          }
        }).catch(err => { msg.innerText = "Erro de conexão ao salvar."; msg.style.color = "red"; btn.disabled = false; btn.innerText = "Tentar Novamente"; });
      }
    </script>
  </body>
</html>
